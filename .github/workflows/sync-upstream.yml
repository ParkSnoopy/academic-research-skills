name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: actions/checkout@v4 - Check Out Fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: bash - Merge Upstream and Retain Approved Paths
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          UPSTREAM_URL: https://github.com/Imbad0202/academic-research-skills
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          if ! git merge --no-commit --no-ff FETCH_HEAD; then
            test "$(git ls-files --unmerged)" != ""
            git diff --name-only --diff-filter=U -z |
              git --literal-pathspecs restore --source=FETCH_HEAD --staged --worktree \
                --pathspec-from-file=- --pathspec-file-nul
          fi
          git restore --source=HEAD --staged --worktree -- .github/workflows/sync-upstream.yml
          # `skills/` contains symlinks into these existing top-level skill folders.
          retained=(
            LICENSE
            NOTICE.md
            THIRD_PARTY.md
            .github/workflows/sync-upstream.yml
            skills/
            academic-paper/
            academic-paper-reviewer/
            academic-pipeline/
            deep-research/
            sr-screener/
            agents/
            shared/
            scripts/
            commands/
          )
          excluded=(':(top,glob,exclude)LICENSE*')
          for file in "${retained[@]}"; do
            excluded+=(":(top,exclude,literal)$file")
          done
          # Discard only excluded upstream paths.
          git rm -r --force --ignore-unmatch -- . "${excluded[@]}"

          test -f LICENSE
          test -f .github/workflows/sync-upstream.yml
          test "$(git ls-files -- . "${excluded[@]}")" = ""
          for skill in academic-paper academic-paper-reviewer academic-pipeline deep-research; do
            test -f "skills/$skill/SKILL.md"
          done
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null || ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream skills"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
